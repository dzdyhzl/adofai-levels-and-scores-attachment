<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUF 谱面详情</title>
  <link rel="stylesheet" href="assets/common.css">
  <link rel="stylesheet" href="assets/level.css">
</head>

<body>
  <nav class="topNav">
    <div class="topNavInner">
      <a class="topNavLink active" href="index.html">谱面搜索</a>
      <a class="topNavLink" href="ranking.html">玩家排名</a>
    </div>
  </nav>
  <header>
    <div class="brand">
      <div class="brandMark">TUF</div>
      <div>
        <h1 id="pageTitle">谱面详情</h1>
        <p class="subtitle">The Universal Forums · 谱面详情</p>
      </div>
    </div>
    <a class="backLink" href="index.html">← 返回搜索</a>
  </header>

  <main>
    <section class="panel" id="statusPanel">
      <p id="status">加载中…</p>
    </section>

    <section class="panel" id="infoPanel" hidden>
      <h2 class="panelTitle">常规信息</h2>
      <div class="infoLayout">
        <dl id="infoList"></dl>
        <div class="actionColumn">
          <a class="tufLink" id="tufLink" href="#" target="_blank" rel="noopener">进入TUF界面</a>
          <button id="downloadBtn">下载谱面</button>
          <button id="videoBtn" class="secondary">观看演示视频</button>
          <p class="actionStatus" id="downloadStatus"></p>
        </div>
      </div>
    </section>

    <section class="panel" id="statsPanel" hidden>
      <h2 class="panelTitle">关键记录</h2>
      <div class="statGrid" id="statGrid"></div>
    </section>

    <section class="panel" id="passesPanel" hidden>
      <h2 class="panelTitle">通关记录</h2>
      <div class="passToolbar">
        <label>按精确度
          <select id="sortAccuracy">
            <option value="">不排序</option>
            <option value="asc">升序</option>
            <option value="desc" selected>降序</option>
          </select>
        </label>
        <label>按速度
          <select id="sortSpeed">
            <option value="">不排序</option>
            <option value="asc" selected>升序</option>
            <option value="desc">降序</option>
          </select>
        </label>
        <label>按通过时间
          <select id="sortTime">
            <option value="">不排序</option>
            <option value="asc" selected>升序</option>
            <option value="desc">降序</option>
          </select>
        </label>
        <span id="passMeta"></span>
      </div>
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>通关者</th>
              <th>准度</th>
              <th>速度</th>
              <th>Perfect</th>
              <th>稍快</th>
              <th>稍慢</th>
              <th>太快</th>
              <th>太慢</th>
              <th>提前</th>
              <th>通过日期</th>
            </tr>
          </thead>
          <tbody id="passBody"></tbody>
        </table>
      </div>
      <div id="pager" hidden>
        <span id="pageNumbers"></span>
        <div class="jumpRow">
          <label class="jumpLabel" for="jumpInput">跳转至</label>
          <input id="jumpInput" type="number" min="1">
          <span class="jumpUnit">页</span>
          <button id="jumpBtn" type="button">跳转</button>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/common.js"></script>
  <script>
    const PAGE_SIZE = 20;

    const pageTitle = document.getElementById("pageTitle");
    const statusPanel = document.getElementById("statusPanel");
    const statusEl = document.getElementById("status");
    const infoPanel = document.getElementById("infoPanel");
    const infoList = document.getElementById("infoList");
    const downloadBtn = document.getElementById("downloadBtn");
    const tufLink = document.getElementById("tufLink");
    const downloadStatus = document.getElementById("downloadStatus");
    const videoBtn = document.getElementById("videoBtn");
    const statsPanel = document.getElementById("statsPanel");
    const statGrid = document.getElementById("statGrid");
    const passesPanel = document.getElementById("passesPanel");
    const passBody = document.getElementById("passBody");
    const passMeta = document.getElementById("passMeta");
    const sortTimeInput = document.getElementById("sortTime");
    const sortAccuracyInput = document.getElementById("sortAccuracy");
    const sortSpeedInput = document.getElementById("sortSpeed");
    const pager = document.getElementById("pager");
    const pageNumbers = document.getElementById("pageNumbers");
    const jumpInput = document.getElementById("jumpInput");
    const jumpBtn = document.getElementById("jumpBtn");

    const base = API_BASE;

    let level = null;
    let passes = [];
    let page = 1;
    let lastPages = 1;

    function formatSpeed(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return null;
      return `${number}`;
    }

    function dateValue(pass) {
      if (!pass?.vidUploadTime) return Number.POSITIVE_INFINITY;
      const time = new Date(pass.vidUploadTime).getTime();
      return Number.isNaN(time) ? Number.POSITIVE_INFINITY : time;
    }

    function playerName(pass) {
      return toText(pass?.player) || (pass?.playerId != null ? `玩家 ${pass.playerId}` : "未知");
    }

    function mergedPerfect(pass) {
      const judgements = pass?.judgements ?? {};
      return (
        (Number(judgements.perfect) || 0) +
        (Number(judgements.perfectMinus) || 0) +
        (Number(judgements.perfectPlus) || 0) +
        (Number(judgements.lateDouble) || 0)
      );
    }

    async function fetchJson(url) {
      const res = await fetch(url, {
        credentials: "include",
        headers: { Accept: "application/json" }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function renderInfo(difficulty) {
      const credits = Array.isArray(level.levelCredits) ? level.levelCredits : [];
      const charters = credits
        .filter((credit) => String(credit.role).toLowerCase() === "charter")
        .map((credit) => toText(credit.creator) || toText(credit.creatorId))
        .filter(Boolean);
      const vfxers = credits
        .filter((credit) => String(credit.role).toLowerCase() === "vfxer")
        .map((credit) => toText(credit.creator) || toText(credit.creatorId))
        .filter(Boolean);

      const name = [toText(level.song), toText(level.suffix)].filter(Boolean).join(" ");
      const durationMs = Number(level.levelLengthInMs);

      const rows = [
        ["谱面 ID", toText(level.id)],
        ["谱面名", name || null],
        ["曲师", toText(level.artist) ?? toText(level.artists)],
        ["谱师", charters.length ? charters.join(", ") : toText(level.creator)]
      ];
      if (vfxers.length) {
        rows.push(["VFX", vfxers.join(", ")]);
      }
      rows.push(
        ["评级", toText(difficulty?.name)],
        ["谱面底分", toText(difficulty?.baseScore ?? level.baseScore)],
        ["歌曲时长", Number.isFinite(durationMs) && durationMs > 0 ? formatDuration(durationMs / 1000) : null],
        ["总轨道数", toText(level.tilecount ?? level.tileCount)],
        ["初始 BPM", toText(level.bpm)]
      );

      infoList.innerHTML = "";
      for (const [label, value] of rows) {
        const dt = document.createElement("dt");
        dt.textContent = label;
        const dd = document.createElement("dd");
        if (label === "评级" && value && difficulty) {
          dd.append(createDiffBadge(difficulty, value));
        } else {
          dd.textContent = value ?? "未获取到";
        }
        infoList.append(dt, dd);
      }

      pageTitle.textContent = name || "谱面详情";
      document.title = `${name || "谱面详情"} · TUF`;
      tufLink.href = `https://tuforums.com/levels/${level.id}`;

      if (level.videoLink) {
        videoBtn.disabled = false;
        videoBtn.textContent = "观看演示视频";
        if (!videoBtn.dataset.bound) {
          videoBtn.dataset.bound = "true";
          videoBtn.addEventListener("click", () => {
            if (level?.videoLink) window.open(level.videoLink, "_blank", "noopener");
          });
        }
      } else {
        videoBtn.disabled = true;
        videoBtn.textContent = "无演示视频";
      }

      downloadBtn.addEventListener("click", async () => {
        downloadBtn.disabled = true;
        downloadStatus.classList.remove("error");
        downloadStatus.textContent = "查询 CDN…";
        try {
          let cdnData = null;
          try {
            cdnData = await fetchJson(`${base}/v2/database/levels/${level.id}/cdnData`);
          } catch {
            cdnData = null;
          }
          const meta = cdnData?.metadata ?? {};
          const archive = meta.originalArchive ?? meta.originalZip ?? null;
          const dlLink = level.dlLink || "";
          if (!archive && !dlLink) {
            downloadStatus.textContent = "该谱面无 CDN 文件";
            return;
          }
          const fileName = archive?.originalFilename || archive?.name || "谱面压缩包";
          const sizeMb = archive?.size ? `${(archive.size / 1048576).toFixed(1)} MB` : "";
          const detail = [fileName, sizeMb].filter(Boolean).join("，");
          if (window.confirm(`确认下载谱面「${name || level.id}」？\n${detail}`)) {
            const anchor = document.createElement("a");
            anchor.href = dlLink || `https://cdn.tuforums.com/${archive.path}`;
            anchor.rel = "noopener";
            anchor.click();
            downloadStatus.textContent = "已开始下载";
          } else {
            downloadStatus.textContent = "已取消下载";
          }
        } catch (error) {
          downloadStatus.textContent = `获取 CDN 失败：${error.message}`;
          downloadStatus.classList.add("error");
        } finally {
          downloadBtn.disabled = false;
        }
      });
    }

    function pickBest(pool, valueOf) {
      let best = null;
      let bestValue = null;
      for (const pass of pool) {
        const value = valueOf(pass);
        if (value == null || !Number.isFinite(value)) continue;
        if (bestValue == null || value > bestValue) {
          best = pass;
          bestValue = value;
        } else if (value === bestValue && dateValue(pass) < dateValue(best)) {
          best = pass;
        }
      }
      return best ? { pass: best, value: bestValue } : null;
    }

    function pickFirstClear(pool) {
      const worldsFirst = pool.filter((pass) => pass.isWorldsFirst);
      const candidates = worldsFirst.length ? worldsFirst : pool;
      let best = null;
      for (const pass of candidates) {
        if (!best || dateValue(pass) < dateValue(best)) best = pass;
      }
      return best;
    }

    function addStatCard(label, pass, value) {
      const card = document.createElement("div");
      card.className = "statCard";

      const labelEl = document.createElement("div");
      labelEl.className = "statLabel";
      labelEl.textContent = label;

      const playerEl = document.createElement("div");
      playerEl.className = "statPlayer";
      playerEl.textContent = pass ? playerName(pass) : "无记录";

      const valueEl = document.createElement("div");
      valueEl.className = "statValue";
      valueEl.textContent = pass && value != null ? value : "";

      const dateEl = document.createElement("div");
      dateEl.className = "statDate";
      dateEl.textContent = pass ? formatDate(pass.vidUploadTime) : "";

      card.append(labelEl, playerEl, valueEl, dateEl);
      card.classList.add("statIn");
      card.style.animationDelay = `${statGrid.children.length * 60}ms`;
      statGrid.append(card);
    }

    function renderStats(pool) {
      statGrid.innerHTML = "";
      if (!pool.length) {
        const empty = document.createElement("p");
        empty.textContent = "暂无通关记录";
        statGrid.append(empty);
        return;
      }

      const first = pickFirstClear(pool);
      addStatCard("首通", first, first?.isWorldsFirst ? "World's First" : "");

      const bestScore = pickBest(pool, (pass) => Number(pass.scoreV2));
      addStatCard("最高得分", bestScore?.pass, formatScore(bestScore?.value));

      const bestAccuracy = pickBest(pool, (pass) => Number(pass.accuracy));
      addStatCard("最高准度", bestAccuracy?.pass, formatAccuracy(bestAccuracy?.value));

      const bestSpeed = pickBest(pool, (pass) => Number(pass.speed));
      addStatCard("最高速度", bestSpeed?.pass, formatSpeed(bestSpeed?.value));
    }

    function passSortValue(pass, field) {
      if (field === "time") return dateValue(pass);
      if (field === "accuracy") {
        const value = Number(pass.accuracy);
        return Number.isFinite(value) ? value : null;
      }
      if (field === "speed") {
        const value = Number(pass.speed);
        return Number.isFinite(value) ? value : null;
      }
      return null;
    }

    function activeSorts() {
      return [
        { field: "accuracy", direction: sortAccuracyInput.value },
        { field: "speed", direction: sortSpeedInput.value },
        { field: "time", direction: sortTimeInput.value }
      ].filter((item) => item.direction);
    }

    function sortedPasses() {
      const sorts = activeSorts();
      if (!sorts.length) return passes;
      return [...passes].sort((a, b) => {
        for (const { field, direction } of sorts) {
          const av = passSortValue(a, field);
          const bv = passSortValue(b, field);
          if (av == null && bv == null) continue;
          if (av == null) return 1;
          if (bv == null) return -1;
          if (av !== bv) return (av - bv) * (direction === "asc" ? 1 : -1);
        }
        return 0;
      });
    }

    function renderTable() {
      const list = sortedPasses();
      const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
      page = Math.min(page, pages);
      const start = (page - 1) * PAGE_SIZE;
      const slice = list.slice(start, start + PAGE_SIZE);

      passBody.innerHTML = "";
      slice.forEach((pass, rowIndex) => {
        const judgements = pass.judgements ?? {};
        const row = document.createElement("tr");

        const cells = [
          playerName(pass),
          formatAccuracy(pass.accuracy) ?? "—",
          formatSpeed(pass.speed) ?? "—",
          String(mergedPerfect(pass)),
          String(Number(judgements.ePerfect) || 0),
          String(Number(judgements.lPerfect) || 0),
          String(Number(judgements.earlySingle) || 0),
          String(Number(judgements.lateSingle) || 0),
          String(Number(judgements.earlyDouble) || 0),
          formatDate(pass.vidUploadTime)
        ];

        cells.forEach((text, index) => {
          const td = document.createElement("td");
          td.textContent = text;
          if (index >= 1 && index <= 8) td.classList.add("num");
          row.append(td);
        });

        row.classList.add("clickableRow");
        row.classList.add("rowIn");
        row.style.animationDelay = `${rowIndex * 22}ms`;
        row.title = "在 TUF 查看该通关记录";
        row.addEventListener("click", () => {
          if (pass.id == null) return;
          window.open(`https://tuforums.com/passes/${pass.id}`, "_blank", "noopener");
        });

        passBody.append(row);
      });

      lastPages = pages;
      renderPageNumbers(pageNumbers, page, pages, goToPage);
      pager.hidden = list.length === 0;
    }

    async function load() {
      const params = new URLSearchParams(location.search);
      const idParam = (params.get("id") || "").trim();
      if (!idParam) {
        statusEl.textContent = "缺少 id 参数，请从搜索页点击谱面进入。";
        statusEl.classList.add("error");
        return;
      }

      statusEl.textContent = "加载中…";
      statusEl.classList.add("loading");
      try {
        const levelEndpoint = /^\d+$/.test(idParam)
          ? `/v2/database/levels/byId/${encodeURIComponent(idParam)}`
          : `/v2/database/levels/${encodeURIComponent(idParam)}`;

        const levelRaw = await fetchJson(base + levelEndpoint);
        level = levelRaw.level || levelRaw.data || levelRaw;
        if (level?.id == null) throw new Error("未找到谱面");

        const difficulty = await resolveDifficulty(base, level);
        renderInfo(difficulty);

        statusEl.textContent = "加载通关记录…";
        const passList = await fetchJson(`${base}/v2/database/passes/level/${level.id}`);
        passes = (Array.isArray(passList) ? passList : []).filter(
          (pass) => !pass.isHidden && !pass.isDeleted && !pass.isDuplicate
        );

        const total = Array.isArray(passList) ? passList.length : 0;
        passMeta.textContent = `共 ${passes.length} 条有效记录（已过滤 ${total - passes.length} 条隐藏/重复）`;

        renderStats(passes);
        page = 1;
        renderTable();

        statusEl.classList.remove("loading");
        statusPanel.hidden = true;
        infoPanel.hidden = false;
        statsPanel.hidden = false;
        passesPanel.hidden = false;
      } catch (error) {
        statusEl.textContent = `加载失败：${error.message}。线上部署请确认 functions/ 代理已生效，本地请通过 HTTP 服务器打开。`;
        statusEl.classList.add("error");
        statusEl.classList.remove("loading");
      }
    }

    for (const control of [sortTimeInput, sortAccuracyInput, sortSpeedInput]) {
      control.addEventListener("change", () => {
        page = 1;
        renderTable();
      });
    }

    function goToPage(targetPage) {
      page = Math.min(Math.max(1, Math.round(targetPage)), lastPages);
      renderTable();
      passesPanel.scrollIntoView({ block: "start" });
    }

    function submitJump() {
      if (!level) return;
      const value = Number(jumpInput.value);
      if (!Number.isFinite(value)) return;
      jumpInput.value = "";
      goToPage(value);
    }

    jumpBtn.addEventListener("click", submitJump);
    jumpInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") submitJump();
    });

    load();
  </script>
</body>

</html>
