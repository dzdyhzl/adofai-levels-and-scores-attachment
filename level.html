<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUF 谱面详情</title>
  <style>
    :root {
      --bg: #f3f5fa;
      --panel: #ffffff;
      --border: #e6e9f1;
      --text: #1f2430;
      --muted: #6b7280;
      --faint: #8a93a3;
      --accent: #3b6ef6;
      --accent-dark: #2f5ce0;
      --accent-soft: #eef2ff;
      --danger: #d14343;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1100px 480px at 50% -10%, #e8eefc 0%, var(--bg) 55%);
      min-height: 100vh;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 36px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brandMark {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: linear-gradient(135deg, #3b6ef6, #7a5cf0);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .5px;
      box-shadow: 0 8px 18px -8px rgba(59, 110, 246, .8);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: .2px;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 12.5px;
      color: var(--faint);
    }

    .backLink {
      font-size: 13px;
      color: var(--accent-dark);
      text-decoration: none;
      padding: 8px 14px;
      border: 1px solid #c7d2fe;
      border-radius: 9px;
      background: #fff;
      white-space: nowrap;
    }

    .backLink:hover {
      background: var(--accent-soft);
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 22px 20px 48px;
      display: grid;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 10px 28px -22px rgba(16, 24, 40, .35);
    }

    .panelTitle {
      margin: 0 0 14px;
      font-size: 14px;
      font-weight: 600;
      color: #38404e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panelTitle::before {
      content: "";
      width: 4px;
      height: 14px;
      border-radius: 2px;
      background: linear-gradient(180deg, #3b6ef6, #7a5cf0);
    }

    #status {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    #status.error {
      color: var(--danger);
    }

    .infoLayout {
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: 20px;
      align-items: start;
    }

    dl {
      margin: 0;
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 9px 14px;
      font-size: 14px;
    }

    dt {
      color: #7a8290;
    }

    dd {
      margin: 0;
      word-break: break-word;
    }

    .actionColumn {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .tufLink {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      border-radius: 10px;
      border: 1px solid #c7d2fe;
      background: #fff;
      color: #3455d0;
      font-size: 14px;
      text-decoration: none;
      transition: background .15s ease;
    }

    .tufLink:hover {
      background: var(--accent-soft);
    }

    button {
      height: 40px;
      padding: 0 22px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(180deg, #4a7bf8, #3b6ef6);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 18px -10px rgba(59, 110, 246, .9);
      transition: background .15s ease, transform .1s ease, box-shadow .15s ease;
    }

    button:hover:not(:disabled) {
      background: linear-gradient(180deg, #3f70f0, var(--accent-dark));
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: .55;
      cursor: default;
      box-shadow: none;
    }

    button.secondary {
      background: #fff;
      color: #3455d0;
      border: 1px solid #c7d2fe;
      box-shadow: none;
    }

    button.secondary:hover:not(:disabled) {
      background: var(--accent-soft);
    }

    .actionStatus {
      margin: 0;
      font-size: 12.5px;
      color: var(--muted);
      min-height: 18px;
    }

    .actionStatus.error {
      color: var(--danger);
    }

    .statGrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .statCard {
      border: 1px solid #e8ebf3;
      border-radius: 12px;
      background: #fbfcfe;
      padding: 14px 16px;
      display: grid;
      gap: 6px;
    }

    .statLabel {
      font-size: 12px;
      color: #7a8290;
    }

    .statPlayer {
      font-size: 16px;
      font-weight: 600;
      word-break: break-word;
    }

    .statValue {
      font-size: 13px;
      color: #3455d0;
      font-variant-numeric: tabular-nums;
    }

    .statDate {
      font-size: 12px;
      color: var(--faint);
    }

    .passToolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }

    .passToolbar label {
      display: grid;
      gap: 6px;
      font-size: 12.5px;
      color: #5b6472;
    }

    select {
      height: 38px;
      padding: 0 12px;
      border: 1px solid #d5dae4;
      border-radius: 9px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    select:focus {
      outline: none;
      border-color: #7aa2ff;
      box-shadow: 0 0 0 3px rgba(59, 110, 246, .14);
    }

    #passMeta {
      margin: 0 0 4px auto;
      font-size: 12.5px;
      color: var(--muted);
      align-self: center;
    }

    .tableWrap {
      overflow-x: auto;
      border: 1px solid #eceef4;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      min-width: 760px;
    }

    th,
    td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #eceef4;
      white-space: nowrap;
    }

    th {
      background: #f7f9fc;
      font-weight: 600;
      color: #5b6472;
      font-size: 12.5px;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover td {
      background: #fafbfe;
    }

    tbody tr.clickableRow {
      cursor: pointer;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    #pager {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #pager button {
      height: 36px;
      padding: 0 18px;
      background: #fff;
      color: #3455d0;
      border: 1px solid #c7d2fe;
      box-shadow: none;
    }

    #pager button:hover:not(:disabled) {
      background: var(--accent-soft);
    }

    #pageInfo {
      font-size: 13px;
      color: var(--muted);
    }

    .topNav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, .9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .topNavInner {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topNavLink {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 16px;
      border-radius: 9px;
      font-size: 14px;
      color: #4b5563;
      text-decoration: none;
      transition: background .15s ease, color .15s ease;
    }

    .topNavLink:hover {
      background: #f1f4fb;
      color: var(--text);
    }

    .topNavLink.active {
      background: var(--accent-soft);
      color: #2b4bbf;
      font-weight: 600;
    }

    @media (max-width: 820px) {
      .infoLayout {
        grid-template-columns: 1fr;
      }

      .statGrid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 560px) {
      header {
        padding-top: 24px;
        flex-direction: column;
        align-items: flex-start;
      }

      .panel {
        padding: 16px;
      }

      .statGrid {
        grid-template-columns: 1fr;
      }

      dl {
        grid-template-columns: 88px 1fr;
      }
    }
  </style>
</head>

<body>
  <nav class="topNav">
    <div class="topNavInner">
      <a class="topNavLink active" href="index.html">谱面搜索</a>
      <a class="topNavLink" href="ranking.html">玩家排名</a>
    </div>
  </nav>
  <header>
    <div class="brand">
      <div class="brandMark">TUF</div>
      <div>
        <h1 id="pageTitle">谱面详情</h1>
        <p class="subtitle">The Universal Forums · 谱面详情</p>
      </div>
    </div>
    <a class="backLink" href="index.html">← 返回搜索</a>
  </header>

  <main>
    <section class="panel" id="statusPanel">
      <p id="status">加载中…</p>
    </section>

    <section class="panel" id="infoPanel" hidden>
      <h2 class="panelTitle">常规信息</h2>
      <div class="infoLayout">
        <dl id="infoList"></dl>
        <div class="actionColumn">
          <a class="tufLink" id="tufLink" href="#" target="_blank" rel="noopener">进入TUF界面</a>
          <button id="downloadBtn">下载谱面</button>
          <button id="videoBtn" class="secondary">观看演示视频</button>
          <p class="actionStatus" id="downloadStatus"></p>
        </div>
      </div>
    </section>

    <section class="panel" id="statsPanel" hidden>
      <h2 class="panelTitle">关键记录</h2>
      <div class="statGrid" id="statGrid"></div>
    </section>

    <section class="panel" id="passesPanel" hidden>
      <h2 class="panelTitle">通关记录</h2>
      <div class="passToolbar">
        <label>按精确度
          <select id="sortAccuracy">
            <option value="">不排序</option>
            <option value="asc">升序</option>
            <option value="desc" selected>降序</option>
          </select>
        </label>
        <label>按速度
          <select id="sortSpeed">
            <option value="">不排序</option>
            <option value="asc" selected>升序</option>
            <option value="desc">降序</option>
          </select>
        </label>
        <label>按通过时间
          <select id="sortTime">
            <option value="">不排序</option>
            <option value="asc" selected>升序</option>
            <option value="desc">降序</option>
          </select>
        </label>
        <span id="passMeta"></span>
      </div>
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>通关者</th>
              <th>准度</th>
              <th>速度</th>
              <th>Perfect</th>
              <th>稍快</th>
              <th>稍慢</th>
              <th>太快</th>
              <th>太慢</th>
              <th>提前</th>
              <th>通过日期</th>
            </tr>
          </thead>
          <tbody id="passBody"></tbody>
        </table>
      </div>
      <div id="pager" hidden>
        <button id="prevBtn">上一页</button>
        <span id="pageInfo"></span>
        <button id="nextBtn">下一页</button>
      </div>
    </section>
  </main>

  <script>
    const PAGE_SIZE = 20;
    const LOCAL_HOSTS = ["localhost", "127.0.0.1", "::1", "[::1]"];
    const DIRECT_API_BASE = "https://api.tuforums.com";
    const DEFAULT_BASE = LOCAL_HOSTS.includes(location.hostname) ? DIRECT_API_BASE : "";

    const pageTitle = document.getElementById("pageTitle");
    const statusPanel = document.getElementById("statusPanel");
    const statusEl = document.getElementById("status");
    const infoPanel = document.getElementById("infoPanel");
    const infoList = document.getElementById("infoList");
    const downloadBtn = document.getElementById("downloadBtn");
    const tufLink = document.getElementById("tufLink");
    const downloadStatus = document.getElementById("downloadStatus");
    const videoBtn = document.getElementById("videoBtn");
    const statsPanel = document.getElementById("statsPanel");
    const statGrid = document.getElementById("statGrid");
    const passesPanel = document.getElementById("passesPanel");
    const passBody = document.getElementById("passBody");
    const passMeta = document.getElementById("passMeta");
    const sortTimeInput = document.getElementById("sortTime");
    const sortAccuracyInput = document.getElementById("sortAccuracy");
    const sortSpeedInput = document.getElementById("sortSpeed");
    const pager = document.getElementById("pager");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageInfo = document.getElementById("pageInfo");

    const base = DEFAULT_BASE.replace(/\/+$/, "");

    let level = null;
    let passes = [];
    let page = 1;

    function toText(value) {
      if (value == null) return null;
      if (Array.isArray(value)) {
        const parts = value.map(toText).filter((part) => part != null && part !== "");
        return parts.length ? parts.join(", ") : null;
      }
      if (typeof value === "object") {
        const inner = value.name ?? value.displayName ?? value.title;
        return inner == null ? null : String(inner);
      }
      const text = String(value);
      return text.trim() === "" ? null : text;
    }

    function formatDuration(seconds) {
      const total = Math.floor(Number(seconds));
      if (!Number.isFinite(total) || total <= 0) return null;
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const rest = total % 60;
      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, "0")}:${String(rest).padStart(2, "0")}`;
      }
      return `${minutes}:${String(rest).padStart(2, "0")}`;
    }

    function formatDate(value) {
      if (!value) return "未知";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatAccuracy(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return null;
      return `${(number * 100).toFixed(4)}%`;
    }

    function formatScore(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return null;
      return number.toFixed(2);
    }

    function formatSpeed(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return null;
      return `${number}`;
    }

    function dateValue(pass) {
      if (!pass?.vidUploadTime) return Number.POSITIVE_INFINITY;
      const time = new Date(pass.vidUploadTime).getTime();
      return Number.isNaN(time) ? Number.POSITIVE_INFINITY : time;
    }

    function playerName(pass) {
      return toText(pass?.player) || (pass?.playerId != null ? `玩家 ${pass.playerId}` : "未知");
    }

    function mergedPerfect(pass) {
      const judgements = pass?.judgements ?? {};
      return (
        (Number(judgements.perfect) || 0) +
        (Number(judgements.perfectMinus) || 0) +
        (Number(judgements.perfectPlus) || 0) +
        (Number(judgements.lateDouble) || 0)
      );
    }

    async function fetchJson(url) {
      const res = await fetch(url, {
        credentials: "include",
        headers: { Accept: "application/json" }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function resolveDifficulty(levelData) {
      if (levelData.difficulty) return levelData.difficulty;
      const diffId = levelData.diffId;
      if (diffId == null) return null;
      try {
        const list = await fetchJson(`${base}/v2/database/difficulties`);
        return (
          (Array.isArray(list) ? list : []).find(
            (item) => String(item.id) === String(diffId)
          ) ?? null
        );
      } catch {
        return null;
      }
    }

    function renderInfo(difficulty) {
      const credits = Array.isArray(level.levelCredits) ? level.levelCredits : [];
      const charters = credits
        .filter((credit) => String(credit.role).toLowerCase() === "charter")
        .map((credit) => toText(credit.creator) || toText(credit.creatorId))
        .filter(Boolean);
      const vfxers = credits
        .filter((credit) => String(credit.role).toLowerCase() === "vfxer")
        .map((credit) => toText(credit.creator) || toText(credit.creatorId))
        .filter(Boolean);

      const name = [toText(level.song), toText(level.suffix)].filter(Boolean).join(" ");
      const durationMs = Number(level.levelLengthInMs);

      const rows = [
        ["谱面 ID", toText(level.id)],
        ["谱面名", name || null],
        ["曲师", toText(level.artist) ?? toText(level.artists)],
        ["谱师", charters.length ? charters.join(", ") : toText(level.creator)]
      ];
      if (vfxers.length) {
        rows.push(["VFX", vfxers.join(", ")]);
      }
      rows.push(
        ["评级", toText(difficulty?.name)],
        ["谱面底分", toText(difficulty?.baseScore ?? level.baseScore)],
        ["歌曲时长", Number.isFinite(durationMs) && durationMs > 0 ? formatDuration(durationMs / 1000) : null],
        ["总轨道数", toText(level.tilecount ?? level.tileCount)],
        ["初始 BPM", toText(level.bpm)]
      );

      infoList.innerHTML = "";
      for (const [label, value] of rows) {
        const dt = document.createElement("dt");
        dt.textContent = label;
        const dd = document.createElement("dd");
        dd.textContent = value ?? "未获取到";
        infoList.append(dt, dd);
      }

      pageTitle.textContent = name || "谱面详情";
      document.title = `${name || "谱面详情"} · TUF`;
      tufLink.href = `https://tuforums.com/levels/${level.id}`;

      if (level.videoLink) {
        videoBtn.disabled = false;
        videoBtn.addEventListener("click", () => {
          window.open(level.videoLink, "_blank", "noopener");
        });
      } else {
        videoBtn.disabled = true;
        videoBtn.textContent = "无演示视频";
      }

      downloadBtn.addEventListener("click", async () => {
        downloadBtn.disabled = true;
        downloadStatus.classList.remove("error");
        downloadStatus.textContent = "查询 CDN…";
        try {
          let cdnData = null;
          try {
            cdnData = await fetchJson(`${base}/v2/database/levels/${level.id}/cdnData`);
          } catch {
            cdnData = null;
          }
          const meta = cdnData?.metadata ?? {};
          const archive = meta.originalArchive ?? meta.originalZip ?? null;
          const dlLink = level.dlLink || "";
          if (!archive && !dlLink) {
            downloadStatus.textContent = "该谱面无 CDN 文件";
            return;
          }
          const fileName = archive?.originalFilename || archive?.name || "谱面压缩包";
          const sizeMb = archive?.size ? `${(archive.size / 1048576).toFixed(1)} MB` : "";
          const detail = [fileName, sizeMb].filter(Boolean).join("，");
          if (window.confirm(`确认下载谱面「${name || level.id}」？\n${detail}`)) {
            const anchor = document.createElement("a");
            anchor.href = dlLink || `https://cdn.tuforums.com/${archive.path}`;
            anchor.rel = "noopener";
            anchor.click();
            downloadStatus.textContent = "已开始下载";
          } else {
            downloadStatus.textContent = "已取消下载";
          }
        } catch (error) {
          downloadStatus.textContent = `获取 CDN 失败：${error.message}`;
          downloadStatus.classList.add("error");
        } finally {
          downloadBtn.disabled = false;
        }
      });
    }

    function pickBest(pool, valueOf) {
      let best = null;
      let bestValue = null;
      for (const pass of pool) {
        const value = valueOf(pass);
        if (value == null || !Number.isFinite(value)) continue;
        if (bestValue == null || value > bestValue) {
          best = pass;
          bestValue = value;
        } else if (value === bestValue && dateValue(pass) < dateValue(best)) {
          best = pass;
        }
      }
      return best ? { pass: best, value: bestValue } : null;
    }

    function pickFirstClear(pool) {
      const worldsFirst = pool.filter((pass) => pass.isWorldsFirst);
      const candidates = worldsFirst.length ? worldsFirst : pool;
      let best = null;
      for (const pass of candidates) {
        if (!best || dateValue(pass) < dateValue(best)) best = pass;
      }
      return best;
    }

    function addStatCard(label, pass, value) {
      const card = document.createElement("div");
      card.className = "statCard";

      const labelEl = document.createElement("div");
      labelEl.className = "statLabel";
      labelEl.textContent = label;

      const playerEl = document.createElement("div");
      playerEl.className = "statPlayer";
      playerEl.textContent = pass ? playerName(pass) : "无记录";

      const valueEl = document.createElement("div");
      valueEl.className = "statValue";
      valueEl.textContent = pass && value != null ? value : "";

      const dateEl = document.createElement("div");
      dateEl.className = "statDate";
      dateEl.textContent = pass ? formatDate(pass.vidUploadTime) : "";

      card.append(labelEl, playerEl, valueEl, dateEl);
      statGrid.append(card);
    }

    function renderStats(pool) {
      statGrid.innerHTML = "";
      if (!pool.length) {
        const empty = document.createElement("p");
        empty.textContent = "暂无通关记录";
        statGrid.append(empty);
        return;
      }

      const first = pickFirstClear(pool);
      addStatCard("首通", first, first?.isWorldsFirst ? "World's First" : "");

      const bestScore = pickBest(pool, (pass) => Number(pass.scoreV2));
      addStatCard("最高得分", bestScore?.pass, formatScore(bestScore?.value));

      const bestAccuracy = pickBest(pool, (pass) => Number(pass.accuracy));
      addStatCard("最高准度", bestAccuracy?.pass, formatAccuracy(bestAccuracy?.value));

      const bestSpeed = pickBest(pool, (pass) => Number(pass.speed));
      addStatCard("最高速度", bestSpeed?.pass, formatSpeed(bestSpeed?.value));
    }

    function passSortValue(pass, field) {
      if (field === "time") return dateValue(pass);
      if (field === "accuracy") {
        const value = Number(pass.accuracy);
        return Number.isFinite(value) ? value : null;
      }
      if (field === "speed") {
        const value = Number(pass.speed);
        return Number.isFinite(value) ? value : null;
      }
      return null;
    }

    function activeSorts() {
      return [
        { field: "accuracy", direction: sortAccuracyInput.value },
        { field: "speed", direction: sortSpeedInput.value },
        { field: "time", direction: sortTimeInput.value }
      ].filter((item) => item.direction);
    }

    function sortedPasses() {
      const sorts = activeSorts();
      if (!sorts.length) return passes;
      return [...passes].sort((a, b) => {
        for (const { field, direction } of sorts) {
          const av = passSortValue(a, field);
          const bv = passSortValue(b, field);
          if (av == null && bv == null) continue;
          if (av == null) return 1;
          if (bv == null) return -1;
          if (av !== bv) return (av - bv) * (direction === "asc" ? 1 : -1);
        }
        return 0;
      });
    }

    function renderTable() {
      const list = sortedPasses();
      const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
      page = Math.min(page, pages);
      const start = (page - 1) * PAGE_SIZE;
      const slice = list.slice(start, start + PAGE_SIZE);

      passBody.innerHTML = "";
      for (const pass of slice) {
        const judgements = pass.judgements ?? {};
        const row = document.createElement("tr");

        const cells = [
          playerName(pass),
          formatAccuracy(pass.accuracy) ?? "—",
          formatSpeed(pass.speed) ?? "—",
          String(mergedPerfect(pass)),
          String(Number(judgements.ePerfect) || 0),
          String(Number(judgements.lPerfect) || 0),
          String(Number(judgements.earlySingle) || 0),
          String(Number(judgements.lateSingle) || 0),
          String(Number(judgements.earlyDouble) || 0),
          formatDate(pass.vidUploadTime)
        ];

        cells.forEach((text, index) => {
          const td = document.createElement("td");
          td.textContent = text;
          if (index >= 1 && index <= 8) td.classList.add("num");
          row.append(td);
        });

        row.classList.add("clickableRow");
        row.title = "在 TUF 查看该通关记录";
        row.addEventListener("click", () => {
          if (pass.id == null) return;
          window.open(`https://tuforums.com/passes/${pass.id}`, "_blank", "noopener");
        });

        passBody.append(row);
      }

      pageInfo.textContent = `第 ${page} / ${pages} 页`;
      prevBtn.disabled = page <= 1;
      nextBtn.disabled = page >= pages;
      pager.hidden = false;
    }

    async function load() {
      const params = new URLSearchParams(location.search);
      const idParam = (params.get("id") || "").trim();
      if (!idParam) {
        statusEl.textContent = "缺少 id 参数，请从搜索页点击谱面进入。";
        statusEl.classList.add("error");
        return;
      }

      statusEl.textContent = "加载中…";
      try {
        const levelEndpoint = /^\d+$/.test(idParam)
          ? `/v2/database/levels/byId/${encodeURIComponent(idParam)}`
          : `/v2/database/levels/${encodeURIComponent(idParam)}`;

        const levelRaw = await fetchJson(base + levelEndpoint);
        level = levelRaw.level || levelRaw.data || levelRaw;
        if (level?.id == null) throw new Error("未找到谱面");

        const difficulty = await resolveDifficulty(level);
        renderInfo(difficulty);

        statusEl.textContent = "加载通关记录…";
        const passList = await fetchJson(`${base}/v2/database/passes/level/${level.id}`);
        passes = (Array.isArray(passList) ? passList : []).filter(
          (pass) => !pass.isHidden && !pass.isDeleted && !pass.isDuplicate
        );

        const total = Array.isArray(passList) ? passList.length : 0;
        passMeta.textContent = `共 ${passes.length} 条有效记录（已过滤 ${total - passes.length} 条隐藏/重复）`;

        renderStats(passes);
        page = 1;
        renderTable();

        statusPanel.hidden = true;
        infoPanel.hidden = false;
        statsPanel.hidden = false;
        passesPanel.hidden = false;
      } catch (error) {
        statusEl.textContent = `加载失败：${error.message}。线上部署请确认 functions/ 代理已生效，本地请通过 HTTP 服务器打开。`;
        statusEl.classList.add("error");
      }
    }

    for (const control of [sortTimeInput, sortAccuracyInput, sortSpeedInput]) {
      control.addEventListener("change", () => {
        page = 1;
        renderTable();
      });
    }

    prevBtn.addEventListener("click", () => {
      if (page > 1) {
        page -= 1;
        renderTable();
      }
    });

    nextBtn.addEventListener("click", () => {
      page += 1;
      renderTable();
    });

    load();
  </script>
</body>

</html>
