<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玩家排名 · TUF</title>
  <link rel="stylesheet" href="assets/common.css">
  <link rel="stylesheet" href="assets/ranking.css">
</head>

<body>
  <nav class="topNav">
    <div class="topNavInner">
      <a class="topNavLink" href="index.html">谱面搜索</a>
      <a class="topNavLink active" href="ranking.html">玩家排名</a>
    </div>
  </nav>

  <header>
    <div class="brand">
      <div class="brandMark">TUF</div>
      <div>
        <h1>玩家排名</h1>
        <p class="subtitle">The Universal Forums · 玩家排行榜</p>
      </div>
    </div>
  </header>

  <main>
    <section class="panel" id="statusPanel">
      <p id="status">加载中…</p>
    </section>

    <section class="panel" id="boardPanel" hidden>
      <h2 class="panelTitle">排行榜</h2>
      <div class="toolbar">
        <label>排序字段
          <select id="sortField"></select>
        </label>
        <label>排序方向
          <select id="sortOrder">
            <option value="desc" selected>降序</option>
            <option value="asc">升序</option>
          </select>
        </label>
        <span id="boardMeta"></span>
      </div>
      <div class="rangeBlock">
        <div class="rangeGrid">
          <div class="rangeRow">
            <span class="rangeLabel">排位分数</span>
            <input id="minRankedScore" type="number" placeholder="下限">
            <span class="rangeDash">~</span>
            <input id="maxRankedScore" type="number" placeholder="上限">
          </div>
          <div class="rangeRow">
            <span class="rangeLabel">总分数</span>
            <input id="minGeneralScore" type="number" placeholder="下限">
            <span class="rangeDash">~</span>
            <input id="maxGeneralScore" type="number" placeholder="上限">
          </div>
          <div class="rangeRow">
            <span class="rangeLabel">PP 分</span>
            <input id="minPpScore" type="number" placeholder="下限">
            <span class="rangeDash">~</span>
            <input id="maxPpScore" type="number" placeholder="上限">
          </div>
          <div class="rangeRow">
            <span class="rangeLabel">平均 XAcc（%）</span>
            <input id="minAverageXacc" type="number" min="0" max="100" step="any" placeholder="下限">
            <span class="rangeDash">~</span>
            <input id="maxAverageXacc" type="number" min="0" max="100" step="any" placeholder="上限">
          </div>
        </div>
        <p class="rangeHint">多个范围可同时生效，可只填一侧；平均 XAcc 按百分数填写（如 99.5）。</p>
      </div>
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>排名</th>
              <th>玩家</th>
              <th>国家</th>
              <th>排位分数</th>
              <th>PP 分</th>
              <th>平均 XAcc</th>
              <th>通过数</th>
              <th>WF 数</th>
            </tr>
          </thead>
          <tbody id="boardBody"></tbody>
        </table>
      </div>
      <div id="pager" hidden>
        <span id="pageNumbers"></span>
        <div class="jumpRow">
          <label class="jumpLabel" for="jumpInput">跳转至</label>
          <input id="jumpInput" type="number" min="1">
          <span class="jumpUnit">页</span>
          <button id="jumpBtn" type="button">跳转</button>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/common.js"></script>
  <script>
    const PAGE_SIZE = 50;
    const base = API_BASE;

    const SORT_FIELDS = [
      { field: "rankedScore", label: "排位分数" },
      { field: "generalScore", label: "总分数" },
      { field: "ppScore", label: "PP 分" },
      { field: "totalScoreV2", label: "ScoreV2 总分" },
      { field: "wfScore", label: "WF 分" },
      { field: "score12K", label: "12K 分数" },
      { field: "averageXacc", label: "平均 XAcc" },
      { field: "totalPasses", label: "通过数" },
      { field: "universalPassCount", label: "Universal 通过数" },
      { field: "worldsFirstCount", label: "WF 数" }
    ];

    const statusPanel = document.getElementById("statusPanel");
    const statusEl = document.getElementById("status");
    const boardPanel = document.getElementById("boardPanel");
    const boardBody = document.getElementById("boardBody");
    const boardMeta = document.getElementById("boardMeta");
    const sortField = document.getElementById("sortField");
    const sortOrder = document.getElementById("sortOrder");
    const pager = document.getElementById("pager");
    const pageNumbers = document.getElementById("pageNumbers");
    const jumpInput = document.getElementById("jumpInput");
    const jumpBtn = document.getElementById("jumpBtn");

    const RANGE_FILTERS = [
      { key: "rankedScore", min: "minRankedScore", max: "maxRankedScore" },
      { key: "generalScore", min: "minGeneralScore", max: "maxGeneralScore" },
      { key: "ppScore", min: "minPpScore", max: "maxPpScore" },
      { key: "averageXacc", min: "minAverageXacc", max: "maxAverageXacc", percent: true }
    ];

    let page = 1;
    let allPlayers = null;
    let loading = false;
    let filterTimer = null;
    let lastPages = 1;

    for (const filter of RANGE_FILTERS) {
      filter.minInput = document.getElementById(filter.min);
      filter.maxInput = document.getElementById(filter.max);
    }

    for (const { field, label } of SORT_FIELDS) {
      const option = document.createElement("option");
      option.value = field;
      option.textContent = label;
      sortField.append(option);
    }
    sortField.value = "rankedScore";

    function createPlayerBox(player) {
      const wrap = document.createElement("div");
      wrap.className = "playerBox";

      const label = toText(player.name) || `玩家 ${player.id ?? "?"}`;
      const avatar = document.createElement("span");
      avatar.className = "avatar";
      avatar.textContent = label.trim().charAt(0).toUpperCase();

      const pfp = toText(player.pfp);
      if (pfp) {
        const img = document.createElement("img");
        img.alt = "";
        img.loading = "lazy";
        img.src = pfp;
        img.addEventListener("error", () => img.remove());
        avatar.append(img);
      }

      const link = document.createElement("a");
      link.className = "playerLink";
      link.href = `https://tuforums.com/profile/${encodeURIComponent(player.id)}`;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = label;
      link.title = label;

      wrap.append(avatar, link);
      return wrap;
    }

    function makeCell(text, isNum = false) {
      const td = document.createElement("td");
      td.textContent = text;
      if (isNum) td.classList.add("num");
      return td;
    }

    function readRangeValue(raw, percent) {
      const text = raw.trim();
      if (text === "") return null;
      const value = Number(text);
      if (!Number.isFinite(value)) return NaN;
      return percent ? value / 100 : value;
    }

    function getActiveRanges() {
      const ranges = [];
      let invalid = false;
      for (const filter of RANGE_FILTERS) {
        const min = readRangeValue(filter.minInput.value, filter.percent);
        const max = readRangeValue(filter.maxInput.value, filter.percent);
        if (Number.isNaN(min) || Number.isNaN(max)) invalid = true;
        if (min == null && max == null) continue;
        ranges.push({ key: filter.key, min, max });
      }
      return { ranges, invalid };
    }

    function getFilteredPlayers() {
      const { ranges } = getActiveRanges();
      const direction = sortOrder.value === "asc" ? 1 : -1;
      const field = sortField.value;
      const fallback = direction === 1 ? Infinity : -Infinity;
      const list = allPlayers.filter((player) =>
        ranges.every(({ key, min, max }) => {
          const value = Number(player[key]);
          if (!Number.isFinite(value)) return false;
          if (min != null && value < min) return false;
          if (max != null && value > max) return false;
          return true;
        })
      );
      return list.sort((a, b) => {
        const av = Number(a[field]);
        const bv = Number(b[field]);
        const an = Number.isFinite(av) ? av : fallback;
        const bn = Number.isFinite(bv) ? bv : fallback;
        if (an !== bn) return (an - bn) * direction;
        return (Number(a.id) || 0) - (Number(b.id) || 0);
      });
    }

    function renderPage() {
      if (!allPlayers) return;
      const { ranges, invalid } = getActiveRanges();
      const list = getFilteredPlayers();
      const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
      page = Math.min(Math.max(1, page), pages);
      const start = (page - 1) * PAGE_SIZE;
      const slice = list.slice(start, start + PAGE_SIZE);
      const medalEligible =
        sortField.value === "rankedScore" &&
        sortOrder.value === "desc" &&
        ranges.length === 0;

      boardBody.innerHTML = "";
      slice.forEach((player, index) => {
        const position = start + index + 1;
        const row = document.createElement("tr");
        const rankCell = document.createElement("td");
        rankCell.classList.add("num");
        const rankBadge = document.createElement("span");
        rankBadge.className = "rankBadge";
        if (medalEligible && position === 1) rankBadge.classList.add("top1");
        else if (medalEligible && position === 2) rankBadge.classList.add("top2");
        else if (medalEligible && position === 3) rankBadge.classList.add("top3");
        rankBadge.textContent = String(position);
        rankCell.append(rankBadge);
        const playerCell = document.createElement("td");
        playerCell.append(createPlayerBox(player));
        row.classList.add("rowIn");
        row.style.animationDelay = `${index * 12}ms`;
        row.append(
          rankCell,
          playerCell,
          makeCell(toText(player.country) || "—", true),
          makeCell(formatScore(player.rankedScore), true),
          makeCell(formatScore(player.ppScore), true),
          makeCell(formatPercent(player.averageXacc), true),
          makeCell(formatCount(player.totalPasses), true),
          makeCell(formatCount(player.worldsFirstCount), true)
        );
        boardBody.append(row);
      });

      const filteredNote =
        list.length === allPlayers.length ? "" : `，筛选后 ${list.length.toLocaleString("zh-CN")} 人`;
      const invalidNote = invalid ? "，范围输入有无效数字" : "";
      boardMeta.textContent = `共 ${allPlayers.length.toLocaleString("zh-CN")} 名玩家${filteredNote}${invalidNote}（每页 ${PAGE_SIZE} 人）`;
      lastPages = pages;
      renderPageNumbers(pageNumbers, page, pages, goToPage);
      pager.hidden = list.length === 0;
      boardPanel.hidden = false;
    }

    const FETCH_LIMIT = 100;
    const FETCH_BATCH = 8;

    function slimPlayer(player) {
      return {
        id: player.id,
        name: player.name,
        country: player.country,
        pfp: player.pfp,
        rankedScore: player.rankedScore,
        generalScore: player.generalScore,
        ppScore: player.ppScore,
        totalScoreV2: player.totalScoreV2,
        wfScore: player.wfScore,
        wfPPScore: player.wfPPScore,
        score12K: player.score12K,
        averageXacc: player.averageXacc,
        totalPasses: player.totalPasses,
        universalPassCount: player.universalPassCount,
        worldsFirstCount: player.worldsFirstCount
      };
    }

    const LB_CACHE_KEY = "tuf-leaderboard-cache";
    const LB_CACHE_TTL = 5 * 60 * 1000;

    function readLeaderboardCache() {
      try {
        const raw = sessionStorage.getItem(LB_CACHE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.players) || !parsed.players.length) return null;
        if (Date.now() - parsed.time > LB_CACHE_TTL) return null;
        return parsed.players;
      } catch {
        return null;
      }
    }

    function writeLeaderboardCache(players) {
      if (!players.length) return;
      try {
        sessionStorage.setItem(
          LB_CACHE_KEY,
          JSON.stringify({ time: Date.now(), players })
        );
      } catch {}
    }

    async function fetchBoardPage(offset) {
      let lastError = null;
      for (let attempt = 0; attempt < 2; attempt += 1) {
        try {
          const params = new URLSearchParams({
            sortBy: "rankedScore",
            order: "desc",
            limit: String(FETCH_LIMIT),
            offset: String(offset)
          });
          const res = await fetch(`${base}/v3/players/leaderboard?${params}`, {
            credentials: "include",
            headers: { Accept: "application/json" }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const results = Array.isArray(data.results) ? data.results : [];
          return { count: Number(data.count) || results.length, results };
        } catch (error) {
          lastError = error;
          await new Promise((resolve) => setTimeout(resolve, 400));
        }
      }
      throw lastError;
    }

    async function loadBoard() {
      if (loading) return;
      loading = true;
      statusPanel.hidden = false;
      boardPanel.hidden = true;
      statusEl.textContent = "加载中…";
      statusEl.classList.remove("error");
      statusEl.classList.add("loading");

      try {
        const cached = readLeaderboardCache();
        if (cached) {
          allPlayers = cached;
        } else {
          const first = await fetchBoardPage(0);
          const total = first.count;
          const list = first.results.map(slimPlayer);
          const offsets = [];
          for (let offset = FETCH_LIMIT; offset < total; offset += FETCH_LIMIT) {
            offsets.push(offset);
          }
          for (let i = 0; i < offsets.length; i += FETCH_BATCH) {
            const batch = offsets.slice(i, i + FETCH_BATCH);
            const lists = await Promise.all(batch.map(fetchBoardPage));
            for (const item of lists) list.push(...item.results.map(slimPlayer));
            statusEl.textContent = `加载中… ${Math.min(list.length, total).toLocaleString("zh-CN")} / ${total.toLocaleString("zh-CN")}`;
          }
          allPlayers = list;
          writeLeaderboardCache(list);
        }
        page = 1;
        renderPage();
        statusPanel.hidden = true;
      } catch (error) {
        statusEl.textContent = `加载失败：${error.message}。线上部署请确认 functions/ 代理已生效，本地请通过 HTTP 服务器打开。`;
        statusEl.classList.add("error");
      } finally {
        statusEl.classList.remove("loading");
        loading = false;
      }
    }

    function scheduleRender() {
      if (!allPlayers) return;
      clearTimeout(filterTimer);
      filterTimer = setTimeout(() => {
        page = 1;
        renderPage();
      }, 400);
    }

    sortField.addEventListener("change", () => {
      if (allPlayers) {
        page = 1;
        renderPage();
      }
    });
    sortOrder.addEventListener("change", () => {
      if (allPlayers) {
        page = 1;
        renderPage();
      }
    });
    for (const filter of RANGE_FILTERS) {
      filter.minInput.addEventListener("input", scheduleRender);
      filter.maxInput.addEventListener("input", scheduleRender);
    }

    function goToPage(target) {
      page = Math.min(Math.max(1, Math.round(target)), lastPages);
      renderPage();
      boardPanel.scrollIntoView({ block: "start" });
    }

    function submitJump() {
      if (!allPlayers) return;
      const value = Number(jumpInput.value);
      if (!Number.isFinite(value)) return;
      jumpInput.value = "";
      goToPage(value);
    }

    jumpBtn.addEventListener("click", submitJump);
    jumpInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") submitJump();
    });

    loadBoard();
  </script>
</body>

</html>
