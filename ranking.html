<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玩家排名 · TUF</title>
  <style>
    :root {
      --bg: #f3f5fa;
      --panel: #ffffff;
      --border: #e6e9f1;
      --text: #1f2430;
      --muted: #6b7280;
      --faint: #8a93a3;
      --accent: #3b6ef6;
      --accent-dark: #2f5ce0;
      --accent-soft: #eef2ff;
      --danger: #d14343;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1100px 480px at 50% -10%, #e8eefc 0%, var(--bg) 55%);
      min-height: 100vh;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .topNav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, .9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .topNavInner {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topNavLink {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 16px;
      border-radius: 9px;
      font-size: 14px;
      color: #4b5563;
      text-decoration: none;
      transition: background .15s ease, color .15s ease;
    }

    .topNavLink:hover {
      background: #f1f4fb;
      color: var(--text);
    }

    .topNavLink.active {
      background: var(--accent-soft);
      color: #2b4bbf;
      font-weight: 600;
    }

    header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 36px 20px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brandMark {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: linear-gradient(135deg, #3b6ef6, #7a5cf0);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .5px;
      box-shadow: 0 8px 18px -8px rgba(59, 110, 246, .8);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: .2px;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 12.5px;
      color: var(--faint);
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 22px 20px 48px;
      display: grid;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      min-width: 0;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 10px 28px -22px rgba(16, 24, 40, .35);
    }

    .panelTitle {
      margin: 0 0 14px;
      font-size: 14px;
      font-weight: 600;
      color: #38404e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panelTitle::before {
      content: "";
      width: 4px;
      height: 14px;
      border-radius: 2px;
      background: linear-gradient(180deg, #3b6ef6, #7a5cf0);
    }

    #status {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    #status.error {
      color: var(--danger);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }

    .toolbar label {
      display: grid;
      gap: 6px;
      font-size: 12.5px;
      color: #5b6472;
    }

    select {
      height: 38px;
      padding: 0 12px;
      border: 1px solid #d5dae4;
      border-radius: 9px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    select:focus {
      outline: none;
      border-color: #7aa2ff;
      box-shadow: 0 0 0 3px rgba(59, 110, 246, .14);
    }

    #boardMeta {
      margin: 0 0 4px auto;
      font-size: 12.5px;
      color: var(--muted);
      align-self: center;
    }

    .tableWrap {
      overflow-x: auto;
      border: 1px solid #eceef4;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      min-width: 820px;
    }

    th,
    td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #eceef4;
      white-space: nowrap;
    }

    th {
      background: #f7f9fc;
      font-weight: 600;
      color: #5b6472;
      font-size: 12.5px;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover td {
      background: #fafbfe;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    .playerBox {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      flex: none;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #dbe4ff, #c7d2fe);
      color: #3455d0;
      font-size: 13px;
      font-weight: 600;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .playerLink {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }

    .playerLink:hover {
      color: var(--accent-dark);
      text-decoration: underline;
    }

    #pager {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #pager button {
      height: 36px;
      padding: 0 18px;
      border-radius: 10px;
      border: 1px solid #c7d2fe;
      background: #fff;
      color: #3455d0;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s ease;
    }

    #pager button:hover:not(:disabled) {
      background: var(--accent-soft);
    }

    #pager button:disabled {
      opacity: .55;
      cursor: default;
    }

    #pageInfo {
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      header {
        padding-top: 24px;
      }

      .panel {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <nav class="topNav">
    <div class="topNavInner">
      <a class="topNavLink" href="index.html">谱面搜索</a>
      <a class="topNavLink active" href="ranking.html">玩家排名</a>
    </div>
  </nav>

  <header>
    <div class="brand">
      <div class="brandMark">TUF</div>
      <div>
        <h1>玩家排名</h1>
        <p class="subtitle">The Universal Forums · 玩家排行榜</p>
      </div>
    </div>
  </header>

  <main>
    <section class="panel" id="statusPanel">
      <p id="status">加载中…</p>
    </section>

    <section class="panel" id="boardPanel" hidden>
      <h2 class="panelTitle">排行榜</h2>
      <div class="toolbar">
        <label>排序字段
          <select id="sortField"></select>
        </label>
        <label>排序方向
          <select id="sortOrder">
            <option value="desc" selected>降序</option>
            <option value="asc">升序</option>
          </select>
        </label>
        <span id="boardMeta"></span>
      </div>
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>排名</th>
              <th>玩家</th>
              <th>国家</th>
              <th>排位分数</th>
              <th>PP 分</th>
              <th>平均 XAcc</th>
              <th>通过数</th>
              <th>WF 数</th>
            </tr>
          </thead>
          <tbody id="boardBody"></tbody>
        </table>
      </div>
      <div id="pager" hidden>
        <button id="prevBtn">上一页</button>
        <span id="pageInfo"></span>
        <button id="nextBtn">下一页</button>
      </div>
    </section>
  </main>

  <script>
    const PAGE_SIZE = 50;
    const LOCAL_HOSTS = ["localhost", "127.0.0.1", "::1", "[::1]"];
    const DIRECT_API_BASE = "https://api.tuforums.com";
    const DEFAULT_BASE = LOCAL_HOSTS.includes(location.hostname) ? DIRECT_API_BASE : "";
    const base = DEFAULT_BASE.replace(/\/+$/, "");

    const SORT_FIELDS = [
      { field: "rankedScore", label: "排位分数" },
      { field: "generalScore", label: "综合分数" },
      { field: "ppScore", label: "PP 分" },
      { field: "totalScoreV2", label: "ScoreV2 总分" },
      { field: "wfScore", label: "WF 分" },
      { field: "score12K", label: "12K 分数" },
      { field: "averageXacc", label: "平均 XAcc" },
      { field: "totalPasses", label: "通过数" },
      { field: "universalPassCount", label: "Universal 通过数" },
      { field: "worldsFirstCount", label: "WF 数" }
    ];

    const statusPanel = document.getElementById("statusPanel");
    const statusEl = document.getElementById("status");
    const boardPanel = document.getElementById("boardPanel");
    const boardBody = document.getElementById("boardBody");
    const boardMeta = document.getElementById("boardMeta");
    const sortField = document.getElementById("sortField");
    const sortOrder = document.getElementById("sortOrder");
    const pager = document.getElementById("pager");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageInfo = document.getElementById("pageInfo");

    let page = 1;
    let total = 0;
    let loading = false;

    for (const { field, label } of SORT_FIELDS) {
      const option = document.createElement("option");
      option.value = field;
      option.textContent = label;
      sortField.append(option);
    }
    sortField.value = "rankedScore";

    function toText(value) {
      if (value == null) return null;
      const text = String(value);
      return text.trim() === "" ? null : text;
    }

    function formatScore(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      return number.toLocaleString("zh-CN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function formatPercent(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      return `${(number * 100).toFixed(2)}%`;
    }

    function formatCount(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      return number.toLocaleString("zh-CN");
    }

    function createPlayerBox(player) {
      const wrap = document.createElement("div");
      wrap.className = "playerBox";

      const label = toText(player.name) || `玩家 ${player.id ?? "?"}`;
      const avatar = document.createElement("span");
      avatar.className = "avatar";
      avatar.textContent = label.trim().charAt(0).toUpperCase();

      const pfp = toText(player.pfp);
      if (pfp) {
        const img = document.createElement("img");
        img.alt = "";
        img.loading = "lazy";
        img.src = pfp;
        img.addEventListener("error", () => img.remove());
        avatar.append(img);
      }

      const link = document.createElement("a");
      link.className = "playerLink";
      link.href = `https://tuforums.com/players/${encodeURIComponent(player.id)}`;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = label;
      link.title = label;

      wrap.append(avatar, link);
      return wrap;
    }

    function makeCell(text, isNum = false) {
      const td = document.createElement("td");
      td.textContent = text;
      if (isNum) td.classList.add("num");
      return td;
    }

    function renderTable(players) {
      boardBody.innerHTML = "";
      players.forEach((player, index) => {
        const row = document.createElement("tr");
        const playerCell = document.createElement("td");
        playerCell.append(createPlayerBox(player));
        row.append(
          makeCell(String(player.rank ?? (page - 1) * PAGE_SIZE + index + 1), true),
          playerCell,
          makeCell(toText(player.country) || "—", true),
          makeCell(formatScore(player.rankedScore), true),
          makeCell(formatScore(player.ppScore), true),
          makeCell(formatPercent(player.averageXacc), true),
          makeCell(formatCount(player.totalPasses), true),
          makeCell(formatCount(player.worldsFirstCount), true)
        );
        boardBody.append(row);
      });

      const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      page = Math.min(page, pages);
      boardMeta.textContent = `共 ${total.toLocaleString("zh-CN")} 名玩家（每页 ${PAGE_SIZE} 人）`;
      pageInfo.textContent = `第 ${page} / ${pages} 页`;
      prevBtn.disabled = page <= 1;
      nextBtn.disabled = page >= pages;
      pager.hidden = false;
    }

    async function load(targetPage) {
      if (loading) return;
      loading = true;
      page = targetPage;
      statusPanel.hidden = false;
      boardPanel.hidden = true;
      statusEl.textContent = "加载中…";
      statusEl.classList.remove("error");

      try {
        const params = new URLSearchParams({
          sortBy: sortField.value,
          order: sortOrder.value,
          limit: String(PAGE_SIZE),
          offset: String((page - 1) * PAGE_SIZE)
        });
        const res = await fetch(`${base}/v3/players/leaderboard?${params}`, {
          credentials: "include",
          headers: { Accept: "application/json" }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const players = Array.isArray(data.results) ? data.results : [];
        total = Number(data.count) || players.length;
        renderTable(players);
        statusPanel.hidden = true;
        boardPanel.hidden = false;
      } catch (error) {
        statusEl.textContent = `加载失败：${error.message}。线上部署请确认 functions/ 代理已生效，本地请通过 HTTP 服务器打开。`;
        statusEl.classList.add("error");
      } finally {
        loading = false;
      }
    }

    sortField.addEventListener("change", () => load(1));
    sortOrder.addEventListener("change", () => load(1));
    prevBtn.addEventListener("click", () => {
      if (page > 1) load(page - 1);
    });
    nextBtn.addEventListener("click", () => {
      load(page + 1);
    });

    load(1);
  </script>
</body>

</html>
