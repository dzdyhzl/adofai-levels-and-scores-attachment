<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玩家排名 · TUF</title>
  <style>
    :root {
      --bg: #f3f5fa;
      --panel: #ffffff;
      --border: #e6e9f1;
      --text: #1f2430;
      --muted: #6b7280;
      --faint: #8a93a3;
      --accent: #3b6ef6;
      --accent-dark: #2f5ce0;
      --accent-soft: #eef2ff;
      --danger: #d14343;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1100px 480px at 50% -10%, #e8eefc 0%, var(--bg) 55%);
      min-height: 100vh;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .topNav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, .9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .topNavInner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topNavLink {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 16px;
      border-radius: 9px;
      font-size: 14px;
      color: #4b5563;
      text-decoration: none;
      transition: background .15s ease, color .15s ease;
    }

    .topNavLink:hover {
      background: #f1f4fb;
      color: var(--text);
    }

    .topNavLink.active {
      background: var(--accent-soft);
      color: #2b4bbf;
      font-weight: 600;
    }

    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 20px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brandMark {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: linear-gradient(135deg, #3b6ef6, #7a5cf0);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .5px;
      box-shadow: 0 8px 18px -8px rgba(59, 110, 246, .8);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: .2px;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 12.5px;
      color: var(--faint);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 22px 20px 48px;
      display: grid;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      min-width: 0;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 10px 28px -22px rgba(16, 24, 40, .35);
    }

    .panelTitle {
      margin: 0 0 14px;
      font-size: 14px;
      font-weight: 600;
      color: #38404e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panelTitle::before {
      content: "";
      width: 4px;
      height: 14px;
      border-radius: 2px;
      background: linear-gradient(180deg, #3b6ef6, #7a5cf0);
    }

    #status {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    #status.error {
      color: var(--danger);
    }

    #boardPanel {
      scroll-margin-top: 62px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }

    .toolbar label {
      display: grid;
      gap: 6px;
      font-size: 12.5px;
      color: #5b6472;
    }

    select {
      height: 38px;
      padding: 0 12px;
      border: 1px solid #d5dae4;
      border-radius: 9px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    select:focus {
      outline: none;
      border-color: #7aa2ff;
      box-shadow: 0 0 0 3px rgba(59, 110, 246, .14);
    }

    #boardMeta {
      margin: 0 0 4px auto;
      font-size: 12.5px;
      color: var(--muted);
      align-self: center;
    }

    .tableWrap {
      overflow-x: auto;
      border: 1px solid #eceef4;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      min-width: 820px;
    }

    th,
    td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #eceef4;
      white-space: nowrap;
    }

    th {
      background: #f7f9fc;
      font-weight: 600;
      color: #5b6472;
      font-size: 12.5px;
    }

    th:nth-child(3),
    td:nth-child(3) {
      padding-left: 40px;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover td {
      background: #fafbfe;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    .playerBox {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      flex: none;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #dbe4ff, #c7d2fe);
      color: #3455d0;
      font-size: 13px;
      font-weight: 600;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .playerLink {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }

    .playerLink:hover {
      color: var(--accent-dark);
      text-decoration: underline;
    }

    #pager {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #pager button {
      height: 36px;
      padding: 0 18px;
      border-radius: 10px;
      border: 1px solid #c7d2fe;
      background: #fff;
      color: #3455d0;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s ease;
    }

    #pager button:hover:not(:disabled) {
      background: var(--accent-soft);
    }

    #pager button:disabled {
      opacity: .55;
      cursor: default;
    }

    ::selection {
      background: #c7d7ff;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: #c9d2e3;
      border: 2px solid transparent;
      border-radius: 999px;
      background-clip: padding-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #aab6cf;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    body {
      background:
        radial-gradient(1100px 480px at 50% -10%, #e8eefc 0%, var(--bg) 55%),
        radial-gradient(900px 520px at 100% 100%, #f1ecff 0%, rgba(241, 236, 255, 0) 60%);
      background-attachment: fixed;
    }

    .panel {
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 18px 44px -26px rgba(16, 24, 40, .3);
    }

    .topNav {
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 8px 24px -22px rgba(16, 24, 40, .55);
    }

    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      h1 {
        background: linear-gradient(120deg, #2b3a55, #3b6ef6 55%, #7a5cf0);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    }

    input,
    select {
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input:hover,
    select:hover {
      border-color: #b9c4dd;
    }

    button:focus-visible,
    a:focus-visible,
    summary:focus-visible {
      outline: 2px solid #7aa2ff;
      outline-offset: 2px;
    }

    th {
      letter-spacing: .3px;
    }

    .tableWrap {
      background: #fff;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .03);
    }

    tbody tr:nth-child(even) td {
      background: #fbfcfe;
    }

    tbody tr:hover td {
      background: #f4f7ff;
    }

    .rankBadge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      background: #eef1f7;
      color: #5b6472;
    }

    .rankBadge.top1 {
      background: linear-gradient(135deg, #ffe08a, #f5a623);
      color: #5a3c00;
      box-shadow: 0 4px 10px -4px rgba(245, 166, 35, .9);
    }

    .rankBadge.top2 {
      background: linear-gradient(135deg, #eef2f8, #c3ccd9);
      color: #4a5568;
      box-shadow: 0 4px 10px -4px rgba(160, 174, 192, .9);
    }

    .rankBadge.top3 {
      background: linear-gradient(135deg, #f0c19a, #cd7f4e);
      color: #4a2c12;
      box-shadow: 0 4px 10px -4px rgba(205, 127, 78, .9);
    }

    .avatar {
      box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px #dbe4ff;
    }

    #pager button {
      border-radius: 999px;
      font-weight: 600;
    }

    .rangeBlock {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid #eceef4;
      border-radius: 12px;
      background: #fbfcfe;
      margin-bottom: 12px;
    }

    .rangeGrid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .rangeRow {
      display: grid;
      grid-template-columns: 110px 1fr 14px 1fr;
      gap: 8px;
      align-items: center;
      max-width: 560px;
    }

    .rangeLabel {
      font-size: 12.5px;
      color: #5b6472;
    }

    .rangeRow input {
      height: 34px;
      padding: 0 10px;
    }

    .rangeDash {
      text-align: center;
      color: var(--faint);
      font-size: 12px;
    }

    .rangeHint {
      margin: 0;
      font-size: 12px;
      color: var(--faint);
    }

    #pager {
      display: grid;
      gap: 10px;
      justify-items: start;
    }

    #pageNumbers {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    #pageNumbers button {
      height: 34px;
      min-width: 38px;
      padding: 0 12px;
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      background: #fff;
      color: #3455d0;
      font-size: 13.5px;
      font-variant-numeric: tabular-nums;
      box-shadow: none;
    }

    #pageNumbers button:hover:not(:disabled):not(.currentPage) {
      background: var(--accent-soft);
      transform: none;
    }

    #pageNumbers button.currentPage {
      background: linear-gradient(135deg, #4a7bf8, #3b6ef6);
      border-color: transparent;
      color: #fff;
      cursor: default;
    }

    #pageNumbers button:disabled {
      opacity: .5;
      cursor: default;
    }

    .pageDots {
      color: var(--faint);
      font-size: 13px;
    }

    .jumpRow {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .jumpLabel,
    .jumpUnit {
      font-size: 13px;
      color: var(--muted);
    }

    .jumpRow input {
      width: 90px;
      height: 34px;
    }

    #jumpBtn {
      height: 34px;
      padding: 0 16px;
      font-size: 13px;
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: .45;
      }
    }

    @keyframes shimmer {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    .panel {
      position: relative;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .9),
        0 1px 2px rgba(16, 24, 40, .05),
        0 18px 44px -26px rgba(16, 24, 40, .32);
      animation: panelIn .5s cubic-bezier(.2, .8, .3, 1) both;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 18px;
      right: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(59, 110, 246, .22), transparent);
      pointer-events: none;
    }

    .panel:nth-of-type(2) {
      animation-delay: .07s;
    }

    .topNav {
      transition: box-shadow .2s ease, background .2s ease;
    }

    .topNav.scrolled {
      box-shadow: 0 10px 30px -16px rgba(16, 24, 40, .35);
    }

    tr.rowIn {
      animation: fadeSlide .3s cubic-bezier(.2, .8, .3, 1) both;
    }

    .rankBadge.top1 {
      background-size: 220% 220%;
      animation: shimmer 2.6s ease-in-out infinite;
    }

    .loading {
      animation: pulse 1.4s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      ::before,
      ::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 560px) {
      header {
        padding-top: 24px;
      }

      .panel {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <nav class="topNav">
    <div class="topNavInner">
      <a class="topNavLink" href="index.html">谱面搜索</a>
      <a class="topNavLink active" href="ranking.html">玩家排名</a>
    </div>
  </nav>

  <header>
    <div class="brand">
      <div class="brandMark">TUF</div>
      <div>
        <h1>玩家排名</h1>
        <p class="subtitle">The Universal Forums · 玩家排行榜</p>
      </div>
    </div>
  </header>

  <main>
    <section class="panel" id="statusPanel">
      <p id="status">加载中…</p>
    </section>

    <section class="panel" id="boardPanel" hidden>
      <h2 class="panelTitle">排行榜</h2>
      <div class="toolbar">
        <label>排序字段
          <select id="sortField"></select>
        </label>
        <label>排序方向
          <select id="sortOrder">
            <option value="desc" selected>降序</option>
            <option value="asc">升序</option>
          </select>
        </label>
        <span id="boardMeta"></span>
      </div>
      <div class="rangeBlock">
        <div class="rangeGrid">
          <div class="rangeRow">
            <span class="rangeLabel">排位分数</span>
            <input id="minRankedScore" type="number" placeholder="下限">
            <span class="rangeDash">~</span>
            <input id="maxRankedScore" type="number" placeholder="上限">
          </div>
          <div class="rangeRow">
            <span class="rangeLabel">总分数</span>
            <input id="minGeneralScore" type="number" placeholder="下限">
            <span class="rangeDash">~</span>
            <input id="maxGeneralScore" type="number" placeholder="上限">
          </div>
          <div class="rangeRow">
            <span class="rangeLabel">PP 分</span>
            <input id="minPpScore" type="number" placeholder="下限">
            <span class="rangeDash">~</span>
            <input id="maxPpScore" type="number" placeholder="上限">
          </div>
          <div class="rangeRow">
            <span class="rangeLabel">平均 XAcc（%）</span>
            <input id="minAverageXacc" type="number" min="0" max="100" step="any" placeholder="下限">
            <span class="rangeDash">~</span>
            <input id="maxAverageXacc" type="number" min="0" max="100" step="any" placeholder="上限">
          </div>
        </div>
        <p class="rangeHint">多个范围可同时生效，可只填一侧；平均 XAcc 按百分数填写（如 99.5）。</p>
      </div>
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>排名</th>
              <th>玩家</th>
              <th>国家</th>
              <th>排位分数</th>
              <th>PP 分</th>
              <th>平均 XAcc</th>
              <th>通过数</th>
              <th>WF 数</th>
            </tr>
          </thead>
          <tbody id="boardBody"></tbody>
        </table>
      </div>
      <div id="pager" hidden>
        <span id="pageNumbers"></span>
        <div class="jumpRow">
          <label class="jumpLabel" for="jumpInput">跳转至</label>
          <input id="jumpInput" type="number" min="1">
          <span class="jumpUnit">页</span>
          <button id="jumpBtn" type="button">跳转</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const PAGE_SIZE = 50;
    const LOCAL_HOSTS = ["localhost", "127.0.0.1", "::1", "[::1]"];
    const DIRECT_API_BASE = "https://api.tuforums.com";
    const DEFAULT_BASE = LOCAL_HOSTS.includes(location.hostname) ? DIRECT_API_BASE : "";
    const base = DEFAULT_BASE.replace(/\/+$/, "");

    const SORT_FIELDS = [
      { field: "rankedScore", label: "排位分数" },
      { field: "generalScore", label: "总分数" },
      { field: "ppScore", label: "PP 分" },
      { field: "totalScoreV2", label: "ScoreV2 总分" },
      { field: "wfScore", label: "WF 分" },
      { field: "score12K", label: "12K 分数" },
      { field: "averageXacc", label: "平均 XAcc" },
      { field: "totalPasses", label: "通过数" },
      { field: "universalPassCount", label: "Universal 通过数" },
      { field: "worldsFirstCount", label: "WF 数" }
    ];

    const statusPanel = document.getElementById("statusPanel");
    const statusEl = document.getElementById("status");
    const boardPanel = document.getElementById("boardPanel");
    const boardBody = document.getElementById("boardBody");
    const boardMeta = document.getElementById("boardMeta");
    const sortField = document.getElementById("sortField");
    const sortOrder = document.getElementById("sortOrder");
    const pager = document.getElementById("pager");
    const pageNumbers = document.getElementById("pageNumbers");
    const jumpInput = document.getElementById("jumpInput");
    const jumpBtn = document.getElementById("jumpBtn");

    const RANGE_FILTERS = [
      { key: "rankedScore", min: "minRankedScore", max: "maxRankedScore" },
      { key: "generalScore", min: "minGeneralScore", max: "maxGeneralScore" },
      { key: "ppScore", min: "minPpScore", max: "maxPpScore" },
      { key: "averageXacc", min: "minAverageXacc", max: "maxAverageXacc", percent: true }
    ];

    let page = 1;
    let allPlayers = null;
    let loading = false;
    let filterTimer = null;
    let lastPages = 1;

    for (const filter of RANGE_FILTERS) {
      filter.minInput = document.getElementById(filter.min);
      filter.maxInput = document.getElementById(filter.max);
    }

    for (const { field, label } of SORT_FIELDS) {
      const option = document.createElement("option");
      option.value = field;
      option.textContent = label;
      sortField.append(option);
    }
    sortField.value = "rankedScore";

    function toText(value) {
      if (value == null) return null;
      const text = String(value);
      return text.trim() === "" ? null : text;
    }

    function formatScore(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      return number.toLocaleString("zh-CN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function formatPercent(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      return `${(number * 100).toFixed(2)}%`;
    }

    function formatCount(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      return number.toLocaleString("zh-CN");
    }

    function createPlayerBox(player) {
      const wrap = document.createElement("div");
      wrap.className = "playerBox";

      const label = toText(player.name) || `玩家 ${player.id ?? "?"}`;
      const avatar = document.createElement("span");
      avatar.className = "avatar";
      avatar.textContent = label.trim().charAt(0).toUpperCase();

      const pfp = toText(player.pfp);
      if (pfp) {
        const img = document.createElement("img");
        img.alt = "";
        img.loading = "lazy";
        img.src = pfp;
        img.addEventListener("error", () => img.remove());
        avatar.append(img);
      }

      const link = document.createElement("a");
      link.className = "playerLink";
      link.href = `https://tuforums.com/players/${encodeURIComponent(player.id)}`;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = label;
      link.title = label;

      wrap.append(avatar, link);
      return wrap;
    }

    function makeCell(text, isNum = false) {
      const td = document.createElement("td");
      td.textContent = text;
      if (isNum) td.classList.add("num");
      return td;
    }

    function readRangeValue(raw, percent) {
      const text = raw.trim();
      if (text === "") return null;
      const value = Number(text);
      if (!Number.isFinite(value)) return NaN;
      return percent ? value / 100 : value;
    }

    function getActiveRanges() {
      const ranges = [];
      let invalid = false;
      for (const filter of RANGE_FILTERS) {
        const min = readRangeValue(filter.minInput.value, filter.percent);
        const max = readRangeValue(filter.maxInput.value, filter.percent);
        if (Number.isNaN(min) || Number.isNaN(max)) invalid = true;
        if (min == null && max == null) continue;
        ranges.push({ key: filter.key, min, max });
      }
      return { ranges, invalid };
    }

    function getFilteredPlayers() {
      const { ranges } = getActiveRanges();
      const direction = sortOrder.value === "asc" ? 1 : -1;
      const field = sortField.value;
      const fallback = direction === 1 ? Infinity : -Infinity;
      const list = allPlayers.filter((player) =>
        ranges.every(({ key, min, max }) => {
          const value = Number(player[key]);
          if (!Number.isFinite(value)) return false;
          if (min != null && value < min) return false;
          if (max != null && value > max) return false;
          return true;
        })
      );
      return list.sort((a, b) => {
        const av = Number(a[field]);
        const bv = Number(b[field]);
        const an = Number.isFinite(av) ? av : fallback;
        const bn = Number.isFinite(bv) ? bv : fallback;
        if (an !== bn) return (an - bn) * direction;
        return (Number(a.id) || 0) - (Number(b.id) || 0);
      });
    }

    function renderPage() {
      if (!allPlayers) return;
      const { ranges, invalid } = getActiveRanges();
      const list = getFilteredPlayers();
      const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
      page = Math.min(Math.max(1, page), pages);
      const start = (page - 1) * PAGE_SIZE;
      const slice = list.slice(start, start + PAGE_SIZE);
      const medalEligible =
        sortField.value === "rankedScore" &&
        sortOrder.value === "desc" &&
        ranges.length === 0;

      boardBody.innerHTML = "";
      slice.forEach((player, index) => {
        const position = start + index + 1;
        const row = document.createElement("tr");
        const rankCell = document.createElement("td");
        rankCell.classList.add("num");
        const rankBadge = document.createElement("span");
        rankBadge.className = "rankBadge";
        if (medalEligible && position === 1) rankBadge.classList.add("top1");
        else if (medalEligible && position === 2) rankBadge.classList.add("top2");
        else if (medalEligible && position === 3) rankBadge.classList.add("top3");
        rankBadge.textContent = String(position);
        rankCell.append(rankBadge);
        const playerCell = document.createElement("td");
        playerCell.append(createPlayerBox(player));
        row.classList.add("rowIn");
        row.style.animationDelay = `${index * 12}ms`;
        row.append(
          rankCell,
          playerCell,
          makeCell(toText(player.country) || "—", true),
          makeCell(formatScore(player.rankedScore), true),
          makeCell(formatScore(player.ppScore), true),
          makeCell(formatPercent(player.averageXacc), true),
          makeCell(formatCount(player.totalPasses), true),
          makeCell(formatCount(player.worldsFirstCount), true)
        );
        boardBody.append(row);
      });

      const filteredNote =
        list.length === allPlayers.length ? "" : `，筛选后 ${list.length.toLocaleString("zh-CN")} 人`;
      const invalidNote = invalid ? "，范围输入有无效数字" : "";
      boardMeta.textContent = `共 ${allPlayers.length.toLocaleString("zh-CN")} 名玩家${filteredNote}${invalidNote}（每页 ${PAGE_SIZE} 人）`;
      lastPages = pages;
      renderPageNumbers(page, pages);
      pager.hidden = list.length === 0;
      boardPanel.hidden = false;
    }

    const FETCH_LIMIT = 100;
    const FETCH_BATCH = 8;

    function slimPlayer(player) {
      return {
        id: player.id,
        name: player.name,
        country: player.country,
        pfp: player.pfp,
        rankedScore: player.rankedScore,
        generalScore: player.generalScore,
        ppScore: player.ppScore,
        totalScoreV2: player.totalScoreV2,
        wfScore: player.wfScore,
        wfPPScore: player.wfPPScore,
        score12K: player.score12K,
        averageXacc: player.averageXacc,
        totalPasses: player.totalPasses,
        universalPassCount: player.universalPassCount,
        worldsFirstCount: player.worldsFirstCount
      };
    }

    async function fetchBoardPage(offset) {
      const params = new URLSearchParams({
        sortBy: "rankedScore",
        order: "desc",
        limit: String(FETCH_LIMIT),
        offset: String(offset)
      });
      const res = await fetch(`${base}/v3/players/leaderboard?${params}`, {
        credentials: "include",
        headers: { Accept: "application/json" }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const results = Array.isArray(data.results) ? data.results : [];
      return { count: Number(data.count) || results.length, results };
    }

    async function loadBoard() {
      if (loading) return;
      loading = true;
      statusPanel.hidden = false;
      boardPanel.hidden = true;
      statusEl.textContent = "加载中…";
      statusEl.classList.remove("error");
      statusEl.classList.add("loading");

      try {
        const first = await fetchBoardPage(0);
        const total = first.count;
        const list = first.results.map(slimPlayer);
        const offsets = [];
        for (let offset = FETCH_LIMIT; offset < total; offset += FETCH_LIMIT) {
          offsets.push(offset);
        }
        for (let i = 0; i < offsets.length; i += FETCH_BATCH) {
          const batch = offsets.slice(i, i + FETCH_BATCH);
          const lists = await Promise.all(batch.map(fetchBoardPage));
          for (const item of lists) list.push(...item.results.map(slimPlayer));
          statusEl.textContent = `加载中… ${Math.min(list.length, total).toLocaleString("zh-CN")} / ${total.toLocaleString("zh-CN")}`;
        }
        allPlayers = list;
        page = 1;
        renderPage();
        statusPanel.hidden = true;
      } catch (error) {
        statusEl.textContent = `加载失败：${error.message}。线上部署请确认 functions/ 代理已生效，本地请通过 HTTP 服务器打开。`;
        statusEl.classList.add("error");
      } finally {
        statusEl.classList.remove("loading");
        loading = false;
      }
    }

    function scheduleRender() {
      if (!allPlayers) return;
      clearTimeout(filterTimer);
      filterTimer = setTimeout(() => {
        page = 1;
        renderPage();
      }, 400);
    }

    sortField.addEventListener("change", () => {
      if (allPlayers) {
        page = 1;
        renderPage();
      }
    });
    sortOrder.addEventListener("change", () => {
      if (allPlayers) {
        page = 1;
        renderPage();
      }
    });
    for (const filter of RANGE_FILTERS) {
      filter.minInput.addEventListener("input", scheduleRender);
      filter.maxInput.addEventListener("input", scheduleRender);
    }

    function goToPage(target) {
      page = Math.min(Math.max(1, Math.round(target)), lastPages);
      renderPage();
      boardPanel.scrollIntoView({ block: "start" });
    }

    function renderPageNumbers(current, pages) {
      pageNumbers.innerHTML = "";
      const createButton = (label, target, isCurrent = false, isDisabled = false) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        if (isCurrent) button.classList.add("currentPage");
        if (isDisabled) button.disabled = true;
        else button.addEventListener("click", () => goToPage(target));
        return button;
      };
      const createDots = () => {
        const span = document.createElement("span");
        span.className = "pageDots";
        span.textContent = "…";
        return span;
      };

      pageNumbers.append(createButton("«", 1, false, current <= 1));
      const numbers = new Set([1, pages, current]);
      if (current > 1) numbers.add(current - 1);
      if (current < pages) numbers.add(current + 1);
      let previous = null;
      for (const n of [...numbers].sort((a, b) => a - b)) {
        if (previous != null && n - previous > 1) pageNumbers.append(createDots());
        pageNumbers.append(createButton(String(n), n, n === current));
        previous = n;
      }
      pageNumbers.append(createButton("»", pages, false, current >= pages));
    }

    function submitJump() {
      if (!allPlayers) return;
      const value = Number(jumpInput.value);
      if (!Number.isFinite(value)) return;
      jumpInput.value = "";
      goToPage(value);
    }

    jumpBtn.addEventListener("click", submitJump);
    jumpInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") submitJump();
    });

    const topNavEl = document.querySelector(".topNav");
    if (topNavEl) {
      addEventListener("scroll", () => {
        topNavEl.classList.toggle("scrolled", window.scrollY > 8);
      }, { passive: true });
    }

    loadBoard();
  </script>
</body>

</html>
